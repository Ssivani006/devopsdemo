name: CI/CD - To-Do App to Azure AKS

# Runs automatically on every push to main (and can be started by hand).
# Pull requests only run the build + test stage (nothing is deployed).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}   # e.g. rg-todo-cicd
  AKS_CLUSTER:    ${{ vars.AKS_CLUSTER }}      # e.g. aks-todo
  ACR_NAME:       ${{ vars.ACR_NAME }}         # e.g. todoacr12345 (globally unique)
  IMAGE_NAME:     todo-app

jobs:
  # ------------------------------------------------------------------
  # Stage 1-3: checkout, compile + package with Maven, run tests
  # ------------------------------------------------------------------
  build-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile, run unit tests and package jar
        run: mvn -B clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

      - name: Upload jar for the Docker stage
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/todo-app.jar

  # ------------------------------------------------------------------
  # Stage 4-5: build + tag Docker image, push to Azure Container Registry
  # ------------------------------------------------------------------
  docker:
    name: Docker Build & Push (ACR)
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download jar built in previous stage
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Compute image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and tag Docker image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest" .

      - name: Push image to ACR
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"

  # ------------------------------------------------------------------
  # Stage 6-7: deploy to AKS with Ansible, verify rollout + endpoint
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to AKS (Ansible) & Verify
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials (kubeconfig)
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Install Ansible (+ kubernetes Python client) in a virtualenv
        run: |
          python3 -m venv "$HOME/ansible-venv"
          "$HOME/ansible-venv/bin/pip" install --quiet ansible kubernetes
          "$HOME/ansible-venv/bin/ansible" --version

      - name: Deploy with Ansible playbook
        run: |
          "$HOME/ansible-venv/bin/ansible-playbook" -i ansible/inventory.ini ansible/deploy.yml \
            -e "ansible_python_interpreter=$HOME/ansible-venv/bin/python" \
            -e "image=${{ needs.docker.outputs.image }}" \
            -e "app_version=${{ needs.docker.outputs.version }}"

      - name: Verify deployment status
        run: |
          kubectl get deployment,pods,svc -n todo -o wide
          kubectl rollout history deployment/todo-app -n todo
          IP=$(kubectl get svc todo-app -n todo -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "### Deployed ${{ needs.docker.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Application URL: http://${IP}" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "http://${IP}/api/info" | tee -a "$GITHUB_STEP_SUMMARY"

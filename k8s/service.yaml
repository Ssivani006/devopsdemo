apiVersion: v1
kind: Service
metadata:
  name: todo-app
  namespace: todo
  labels:
    app: todo-app
spec:
  type: LoadBalancer          # Azure creates a public IP for browser access
  selector:
    app: todo-app
  ports:
    - name: http
      port: 80                # public port
      targetPort: 8080        # container port

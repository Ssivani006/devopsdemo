<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List 1</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 40px 16px; }
        .card { max-width: 520px; margin: auto; background: #fff; border-radius: 10px;
                box-shadow: 0 2px 10px rgba(0,0,0,.1); padding: 24px; }
        h1 { margin-top: 0; color: #0f6cbd; }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { padding: 10px 14px; border: 0; border-radius: 6px; background: #0f6cbd; color: #fff; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        li span { flex: 1; cursor: pointer; }
        li.done span { text-decoration: line-through; color: #999; }
        li button { background: #d13438; padding: 6px 10px; }
        footer { margin-top: 16px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="card">
    <h1>My To-Do List</h1>
    <form id="add-form">
        <input id="title" placeholder="What needs to be done?" autocomplete="off" required>
        <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <footer id="info">Loading...</footer>
</div>

<script>
    const api = '/api/todos';

    async function load() {
        const todos = await (await fetch(api)).json();
        const list = document.getElementById('list');
        list.innerHTML = '';
        todos.forEach(t => {
            const li = document.createElement('li');
            if (t.done) li.className = 'done';
            const span = document.createElement('span');
            span.textContent = t.title;           // textContent avoids HTML injection
            span.title = 'Click to mark done / undone';
            span.onclick = async () => { await fetch(`${api}/${t.id}/toggle`, { method: 'PUT' }); load(); };
            const del = document.createElement('button');
            del.textContent = 'Delete';
            del.onclick = async () => { await fetch(`${api}/${t.id}`, { method: 'DELETE' }); load(); };
            li.append(span, del);
            list.append(li);
        });
    }

    document.getElementById('add-form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('title');
        await fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify({ title: input.value }) });
        input.value = '';
        load();
    };

    fetch('/api/info').then(r => r.json()).then(i => {
        document.getElementById('info').textContent = `Version: ${i.version} | Pod: ${i.hostname}`;
    });
    load();
</script>
</body>
</html>

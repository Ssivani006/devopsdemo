server.port=8080
spring.application.name=todo-app

# Version shown on the page. The pipeline overrides it through the
# APP_VERSION environment variable (set in the Kubernetes deployment).
app.version=${APP_VERSION:local-dev}

# Expose only the health endpoint (used by K8s probes and the pipeline)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
